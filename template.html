<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$pagetitle$</title>
  <meta name="description" content="$description$">
  <link rel="canonical" href="https://everytrick.org/">
  <meta property="og:title" content="$pagetitle$">
  <meta property="og:description" content="$description$">
  <meta property="og:image" content="https://everytrick.org/sappho.webp">
  <meta property="og:url" content="https://everytrick.org/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%237e2022'/%3E%3Cpath d='M9 8h11M9 16h14M9 24h9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    /* The page's design. The text is in index.md; Pandoc puts it where $$body$$ stands below.
       Colours and type are those of everytrickinthebook's default style (everytrick/assets/site.css). */
    @font-face { font-family: "Roboto"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("fonts/roboto-latin-wght-normal.woff2") format("woff2"); }
    @font-face { font-family: "Roboto"; font-style: italic; font-weight: 100 900; font-display: swap; src: url("fonts/roboto-latin-wght-italic.woff2") format("woff2"); }

    :root {
      color-scheme: light;
      --colour-background: #f9f8f5;
      --colour-surface: #fff;
      --colour-text: #1d1d1b;
      --colour-muted: #5f5e59;
      --colour-link: #7e2022;
      --colour-accent: #7e2022;
      --colour-rule: #d8d5ce;
      --colour-footer: #efede8;
      --font: "Roboto", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --measure: 38rem;                                         /* the text column */
      --wide: 62rem;                                            /* the opening and the footer */
      --edge: max(1rem, calc((100% - var(--wide)) / 2));        /* space either side of the wide column */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --colour-background: #161614;
        --colour-surface: #22211e;
        --colour-text: #e8e6e0;
        --colour-muted: #a8a59d;
        --colour-link: #eb9a9e;
        --colour-accent: #e07f85;
        --colour-rule: #3b3a36;
        --colour-footer: #1d1c1a;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --colour-background: #161614;
      --colour-surface: #22211e;
      --colour-text: #e8e6e0;
      --colour-muted: #a8a59d;
      --colour-link: #eb9a9e;
      --colour-accent: #e07f85;
      --colour-rule: #3b3a36;
      --colour-footer: #1d1c1a;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--colour-background);
      color: var(--colour-text);
      font: 400 1.125rem/1.65 var(--font);
    }
    a { color: var(--colour-link); text-underline-offset: 0.15em; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--colour-accent); outline-offset: 2px; border-radius: 2px; }
    ::selection { background: color-mix(in srgb, var(--colour-accent) 20%, transparent); }
    code { font-family: var(--font-mono); font-size: 0.9em; }

    /* Every block of index.md sits in the text column, except the opening and the footer, which are wide. */
    main > * { margin-left: var(--edge); margin-right: 1rem; max-width: var(--measure); }
    main > .opening { margin-right: var(--edge); max-width: none; }
    main > .site-footer { margin: 0; max-width: none; }

    p, ul { margin-top: 0; margin-bottom: 1rem; }
    ul { padding-left: 1.25rem; }
    li { margin-bottom: 0.4rem; }
    li::marker { color: var(--colour-muted); }
    h2 { margin-top: 2.5rem; margin-bottom: 0.5rem; font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
    h2::before { content: ""; display: inline-block; width: 0.6em; height: 0.6em; margin-right: 0.5em; background: var(--colour-accent); border-radius: 1px; }

    /* the opening: the name, the tagline and the picture */
    .opening {
      display: grid;
      gap: 2rem;
      padding: 3rem 0 2.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--colour-rule);
    }
    h1.name {
      margin: 0;
      font-weight: 700;
      font-size: clamp(2rem, 1rem + 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    h1.name span { color: var(--colour-accent); }
    .tagline { margin-top: 0.75rem; font-size: 1.35rem; line-height: 1.4; color: var(--colour-muted); }
    .tagline p { margin: 0; }
    .tagline .strong { color: var(--colour-text); }
    figure { margin: 0; }
    figure img { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 4px 12px rgb(0 0 0 / 0.08); }
    figcaption { margin-top: 0.6rem; font-size: 0.85rem; line-height: 1.45; color: var(--colour-muted); }

    /* a box, such as "Get in touch" */
    .contact {
      margin-top: 2.5rem;
      margin-bottom: 3rem;
      padding: 1.25rem 1.5rem;
      background: var(--colour-surface);
      border: 1px solid var(--colour-rule);
      border-radius: 4px;
    }
    .contact h2 { margin-top: 0; font-size: 1.125rem; }
    .contact h2::before { content: none; }              /* a quiet heading: no square */
    .contact p:last-child { margin-bottom: 0; }
    .contact .address { font-size: 1.25rem; font-weight: 600; overflow-wrap: anywhere; }

    .site-footer {
      background: var(--colour-footer);
      color: var(--colour-muted);
      font-size: 0.875rem;
      line-height: 1.55;
      padding: 1.5rem var(--edge) 2rem;
    }
    .site-footer p { max-width: var(--measure); margin-bottom: 0.6rem; }
    .site-footer a { color: inherit; }

    @media (min-width: 48rem) {
      .opening { grid-template-columns: minmax(0, 1fr) 15rem; align-items: end; padding-top: 5rem; }
    }
    @media (min-width: 60rem) {
      .opening { grid-template-columns: minmax(0, 1fr) 18rem; }
    }
  </style>
</head>
<body>
<main>
$body$
</main>
</body>
</html>
